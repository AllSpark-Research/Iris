[project]
name = "iris-harness"
version = "0.1.0"
description = "Evaluation harness for the Iris search agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "miroflow-tools",
    # agent loop + config
    "hydra-core",
    "omegaconf>=2.3.0",
    "python-dotenv",
    "openai>=1.78.1",
    "tiktoken>=0.9.0",          # context accounting for the discard-all trigger
    # tool transport
    "mcp>=1.10,<2",           # the MCP servers target the v1 FastMCP API
    "httpx",
    "pydantic>=2.0.0",
    # parsing / reporting
    "json-repair>=0.49.0",      # salvage malformed tool-call JSON
    "colorama>=0.4.6",
    # benchmark data preparation (data/prepare_data.py)
    "datasets>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
miroflow-tools = { path = "./tools", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-xdist>=3.7.0",
]

[tool.pytest.ini_options]
minversion = "8.3.5"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = ["-rA", "--show-capture=stderr", "-n=auto"]
