[project]
name = "miroflow-tools"
version = "0.1.0"
description = "MCP search/scrape servers and the tool manager used by the Iris harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.10,<2",           # v1 FastMCP API (renamed in mcp 2.x)
    "httpx",
    "pydantic>=2.0.0",
    "markdown-it-py>=3.0.0",  # URL unquoting in tool results
    "PyJWT>=2.8.0",           # Zhipu API auth
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miroflow_tools"]
