# Iris-mini — 35B-A3B, post-trained from Qwen3.6-35B-A3B.
#
# Serve the weights behind any OpenAI-compatible server (we use SGLang) and
# point SGLANG_BASE_URL at it, e.g.
#   export SGLANG_BASE_URL=http://127.0.0.1:21234/v1
defaults:
  - default
  - _self_

provider: "openai"
model_name: "Iris-mini"
api_key: "EMPTY"
base_url: "${oc.env:SGLANG_BASE_URL,http://localhost:21234/v1}"
max_context_length: 262144
max_tokens: 16384
temperature: 1.0
top_p: 0.95

tool_call_mode: "native_fc"
# Prior thinking is embedded as <think>...</think> inside assistant content, so
# the model sees its own reasoning on later turns — matching how the training
# trajectories were laid out.
reasoning_content_mode: "context"
thinking_extra_body:
  chat_template_kwargs:
    enable_thinking: true
    preserve_thinking: true
